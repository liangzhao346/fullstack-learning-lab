name: fullstack-learning-lab
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: learning_lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: ${LAB_DB_PASSWORD:-learning-only}
      MYSQL_ROOT_PASSWORD: ${LAB_MYSQL_ROOT_PASSWORD:-learning-root-only}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6387:6379"]
    volumes: ["redis-data:/data"]
volumes:
  mysql-data:
  redis-data:
